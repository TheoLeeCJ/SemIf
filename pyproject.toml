[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semif-phase1"
version = "0.1.0"
description = "Open baselines for runtime-defined semantic decisions"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26.4,<3",
]

[project.scripts]
semif-score = "semif_phase1.cli:main"

[project.optional-dependencies]
test = ["pytest==8.4.2"]
torch = [
  "numpy==2.2.6",
  "torch==2.10.0",
  "transformers==5.17.0",
  "accelerate==1.12.0",
  "safetensors==0.8.0",
  "huggingface-hub==1.31.0",
  "tokenizers==0.23.2",
  "sentencepiece==0.2.1",
  "protobuf==7.36.1",
]
mlx = [
  "numpy==2.2.6",
  "torch==2.10.0",
  "transformers==5.17.0",
  "accelerate==1.12.0",
  "safetensors==0.8.0",
  "huggingface-hub==1.31.0",
  "tokenizers==0.23.2",
  "sentencepiece==0.2.1",
  "protobuf==7.36.1",
  "mlx==0.32.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "mlx-lm @ git+https://github.com/ml-explore/mlx-lm.git@a63e24c389382619eb6d9af656e3b46024be217a ; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
ryzenai = [
  "numpy==1.26.4",
  "transformers==4.57.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "webgpu-demo"]
